apply from: 'scripts/deploy-variables.gradle'

task downloadApiKeyFile {
//    doLast {
    def apiKeyFile = new File("api_key.properties")
    if (!apiKeyFile.exists()) {
        def apiKeyFileUrl = "${configVariable.apiKeyUrl}"
        new URL(apiKeyFileUrl).withInputStream { i -> apiKeyFile.withOutputStream { it << i } }
    }
//    }
}

preBuild.dependsOn downloadApiKeyFile


android {
    compileSdk mobileToolsVersion.compileSdk

    namespace = "com.dojah.kyc_sdk_kotlin"

    defaultConfig {
//        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true"]
            }
        }
    }

    buildTypes {
        //def apiKeyPropertiesFile = file("api_key.properties")
        //def apiKeyProperties = new Properties()
        // apiKeyProperties.load(new FileInputStream(apiKeyPropertiesFile))
        release {
            minifyEnabled false
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"${configVariable.baseURL}\""
            buildConfigField "String", "PLACE_KEY", "\"${configVariable.placeApiKey}\""
            buildConfigField "String", "AES_ENC_SECRET", "\"${configVariable.aesEncSecret}\""
            buildConfigField "String", "VERSION_NAME", "\"${configVariable.versionName}\""
            buildConfigField "String", "SENTRY_DSN", "\"${configVariable.sentryDsn}\""
        }

        debug {
            minifyEnabled false
            buildConfigField "String", "BASE_URL", "\"${configVariable.baseURL}\""
            buildConfigField "String", "PLACE_KEY", "\"${configVariable.placeApiKey}\""
            buildConfigField "String", "AES_ENC_SECRET", "\"${configVariable.aesEncSecret}\""
            buildConfigField "String", "VERSION_NAME", "\"${configVariable.versionName}\""
            buildConfigField "String", "SENTRY_DSN", "\"${configVariable.sentryDsn}\""
        }

        releaseNoMinify {
            initWith release

            minifyEnabled false
            shrinkResources false
        }
    }

    flavorDimensions "deviceType"
    productFlavors {

        mobile {
            minSdk mobileToolsVersion.minSdk
            targetSdk mobileToolsVersion.targetSdk
            manifestPlaceholders += [authority: mobileToolsVersion.fileProviderAuthority]

            buildConfigField "String", "FILE_PROVIDER_AUTHORITY", "\"${mobileToolsVersion.fileProviderAuthority}\""
            buildConfigField "String", "VERSION_CODE", "\"${configVariable.versionCode}\""
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
//        toolchain.languageVersion.set(JavaLanguageVersion.of(17))
    }

    kotlinOptions {
        jvmTarget = '17'
    }


    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17            // << --- ADD This
        targetCompatibility = JavaVersion.VERSION_17
    }

//    kotlin{
//        jvmToolchain {
//            languageVersion.set(JavaLanguageVersion.of("17"))
//        }
//    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        compose = true
        buildConfig = true
    }
    lint {
        abortOnError false
    }

}

dependencies {

    implementation libs.androidx.compose.runtime.android
    implementation libs.androidx.compose.ui.android
    implementation libs.androidx.paging.runtime.ktx.v311
//    implementation libs.multidex
    coreLibraryDesugaring(libs.desugar)


    // Tests
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    implementation(libs.bundles.androidx)

    implementation(libs.bundles.navigation)

    implementation(libs.preference)

    kapt(libs.bundles.compiler)

    implementation(libs.bundles.network)

//    implementation(libs.hilt)

    implementation(libs.materialdesign)

    implementation(libs.bundles.glide)
    implementation(libs.okhttp3.integration.v505) {
        exclude group: 'glide-parent'
    }
    kapt libs.compiler.v505
//    annotationProcessor 'com.github.bumptech.glide:compiler:4.2.0'


    implementation(libs.timber)

    implementation(libs.libphone)

    implementation libs.play.services.location

    implementation libs.bundles.camera

    implementation libs.otp.view

    implementation libs.lottie
    implementation libs.blurview
    implementation libs.view
    implementation libs.play.services.maps
    implementation libs.play.services.places
    implementation libs.places
    implementation libs.vectorchildfinder
    implementation libs.resizer
    implementation libs.clarity
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.material3
    implementation libs.androidx.ui.tooling
    implementation libs.androidx.ui.tooling.preview
    implementation libs.signature.pad // jetpack Compose views

    implementation libs.face.detection
    implementation(libs.kotlinx.coroutines.android)

    // Sentry error monitoring, tracing & integrations (BOM for consistent versions)
    implementation platform(libs.sentry.bom)
    implementation libs.sentry.android
    implementation libs.sentry.okhttp                // OkHttp/Retrofit HTTP breadcrumbs + tracing
    implementation libs.sentry.android.timber        // Timber log bridge
    implementation libs.sentry.android.navigation    // Jetpack Navigation screen tracking
    implementation libs.sentry.android.fragment      // Fragment lifecycle tracing
    implementation libs.sentry.kotlin.extensions     // Coroutine context propagation

}


publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.dojah-inc'
            artifactId = 'kyc_sdk_kotlin'
            version = 'v0.3.4'
//          version = 'v0.0.01-dev'
            afterEvaluate {
                from components.mobileRelease
            }
        }
    }
}

